<style>
  #t101-game, #t101-game * { box-sizing: border-box; }
  #t101-game { max-width: 100%; overflow-x: hidden; }
  #t101-game p, #t101-game span, #t101-game button { overflow-wrap: break-word; word-break: break-word; }
</style>

<div id="t101-game">
<h2 class="sr-only">台北101バーチャルツアークイズゲーム。エレベーターで6つのフロアを昇りながら、台北101に関するクイズに答えます。</h2>

<div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:0.9rem; gap:6px;">
  <div style="display:flex; align-items:center; gap:6px; min-width:0;">
    <i class="ti ti-building-skyscraper" style="font-size:16px; color:var(--text-accent); flex-shrink:0;" aria-hidden="true"></i>
    <span style="font-size:13px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">台北101ツアー</span>
  </div>
  <div id="score-badge" style="font-size:13px; color:var(--text-secondary); background:var(--surface-1); padding:3px 8px; border-radius:var(--radius); flex-shrink:0;">0/6</div>
</div>

<div id="floor-strip" style="display:flex; align-items:center; margin-bottom:1rem;"></div>

<div id="content"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.44.0/tabler-icons.min.css"></script>
<script>
var stops = [
  {
    floor: "1F",
    name: "エントランスロビー",
    icon: "ti-door-enter",
    fact: "台北101は2004年に完成しました。地上101階、地下5階、高さは508メートル。2010年にドバイのブルジュ・ハリファが完成するまで、世界で一番高いビルでした。",
    question: "台北101の高さは何メートル?",
    options: ["452メートル", "508メートル", "555メートル", "632メートル"],
    correct: 1,
    explain: "正解は508メートルです。屋上のアンテナを含めた高さです。"
  },
  {
    floor: "5F",
    name: "台北101モール",
    icon: "ti-shopping-bag",
    fact: "低層階の1階から5階は、世界的な高級ブランド店が並ぶ台北101モールになっています。",
    question: "台北101はどの都市にある?",
    options: ["高雄", "台中", "台北", "台南"],
    correct: 2,
    explain: "正解は台北です。台湾の首都、信義区に位置しています。"
  },
  {
    floor: "26-38F",
    name: "竹の節デザイン",
    icon: "ti-plant-2",
    fact: "外観は8階ごとに区切られ、竹の節のような形をしています。中華文化では「8」は「発財(お金が儲かる)」に通じる縁起の良い数字です。",
    question: "8階ごとに区切られているのはなぜ?",
    options: ["建築コストを抑えるため", "8は縁起の良い数字だから", "耐震のため必要だから", "単なる偶然"],
    correct: 1,
    explain: "正解は「8は縁起の良い数字だから」です。"
  },
  {
    floor: "87-92F",
    name: "風除ダンパー",
    icon: "ti-circle-dot",
    fact: "87階から92階の間には、重さ660トンの金色の球体「風除ダンパー」が吊り下げられ、台風や地震の揺れを軽減します。",
    question: "風除ダンパーの主な役割は?",
    options: ["展望台の装飾", "エレベーターを動かす", "建物の揺れを軽減する", "雨水を貯める"],
    correct: 2,
    explain: "正解は「建物の揺れを軽減する」です。"
  },
  {
    floor: "89F",
    name: "室内展望台",
    icon: "ti-elevator",
    fact: "5階から89階までは世界最速級のエレベーターで一気に上がります。分速1010メートルで約37秒で到着します。",
    question: "エレベーターは何階から何階まで37秒?",
    options: ["1F→89F", "5F→89F", "1F→101F", "5F→101F"],
    correct: 1,
    explain: "正解は「5F→89F」です。"
  },
  {
    floor: "91F",
    name: "屋外展望台",
    icon: "ti-fireworks",
    fact: "91階の屋外展望台からは台北の街を360度見渡せます。大晦日の花火ショーでも世界的に有名です。",
    question: "毎年大晦日に行われる有名なイベントは?",
    options: ["マラソン大会", "花火ショー", "音楽フェスティバル", "灯篭流し"],
    correct: 1,
    explain: "正解は「花火ショー」です。"
  }
];

var letters = ["A", "B", "C", "D"];
var current = 0;
var phase = "fact";
var score = 0;
var answered = false;

function renderStrip() {
  var strip = document.getElementById("floor-strip");
  var html = "";
  for (var i = 0; i < stops.length; i++) {
    var state = i < current ? "done" : (i === current ? "active" : "todo");
    var dotColor = state === "done" ? "var(--text-success)" : (state === "active" ? "var(--text-accent)" : "var(--border-strong)");
    var dotBg = state === "active" ? "var(--bg-accent)" : "transparent";
    html += '<div style="display:flex; align-items:center; flex:1; min-width:0;">';
    html += '<div style="width:16px; height:16px; border-radius:50%; border:1.5px solid ' + dotColor + '; background:' + dotBg + '; display:flex; align-items:center; justify-content:center; font-size:8px; font-weight:500; color:' + (state === "todo" ? "var(--text-muted)" : dotColor) + '; flex-shrink:0;">';
    html += (state === "done" ? '<i class="ti ti-check" style="font-size:9px;" aria-hidden="true"></i>' : (i + 1));
    html += '</div>';
    if (i < stops.length - 1) {
      html += '<div style="height:1.5px; flex:1; background:' + (i < current ? "var(--text-success)" : "var(--border)") + ';"></div>';
    }
    html += '</div>';
  }
  strip.innerHTML = html;
}

function renderScore() {
  document.getElementById("score-badge").textContent = score + "/" + stops.length;
}

function headerBlock(stop, tag) {
  var html = '<div style="display:flex; align-items:center; gap:7px; margin-bottom:14px;">';
  html += '<div style="width:28px; height:28px; border-radius:8px; background:var(--bg-accent); display:flex; align-items:center; justify-content:center; flex-shrink:0;"><i class="ti ' + stop.icon + '" style="font-size:14px; color:var(--text-accent);" aria-hidden="true"></i></div>';
  html += '<div style="min-width:0; flex:1;"><p style="font-weight:500; font-size:13px; margin:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">' + stop.floor + ' ' + stop.name + '</p><p style="font-size:10px; color:var(--text-muted); margin:0;">' + (current + 1) + ' / ' + stops.length + ' ・ ' + tag + '</p></div>';
  html += '</div>';
  return html;
}

function renderFact() {
  var stop = stops[current];
  var html = '<div style="background:var(--surface-1); border-radius:12px; padding:0.8rem 0.6rem;">';
  html += headerBlock(stop, "豆知識");
  html += '<p style="font-size:40px; color:var(--text-primary, var(--text-secondary)); line-height:1.45; margin:0 0 1.1rem;">' + stop.fact + '</p>';
  html += '<button onclick="goToQuiz()" style="font-size:18px; padding:13px 12px; width:100%;">クイズに挑戦 <i class="ti ti-arrow-right" style="font-size:19px; vertical-align:-2px;" aria-hidden="true"></i></button>';
  html += '</div>';
  document.getElementById("content").innerHTML = html;
  renderStrip();
  renderScore();
}

function renderQuiz() {
  answered = false;
  var stop = stops[current];
  var html = '<div style="background:var(--surface-1); border-radius:12px; padding:0.8rem 0.55rem;">';
  html += headerBlock(stop, "クイズ");
  html += '<p style="font-size:40px; font-weight:500; margin:0 0 14px; line-height:1.35;">' + stop.question + '</p>';
  html += '<div id="options" style="display:flex; flex-direction:column; gap:9px;">';
  for (var i = 0; i < stop.options.length; i++) {
    html += '<button id="opt-' + i + '" onclick="selectAnswer(' + i + ')" style="display:flex; align-items:center; gap:9px; text-align:left; font-size:24px; padding:12px 8px; white-space:normal; line-height:1.35; width:100%;">';
    html += '<span id="opt-badge-' + i + '" style="flex-shrink:0; width:30px; height:30px; border-radius:50%; border:1px solid var(--border-strong); display:flex; align-items:center; justify-content:center; font-size:16px; font-weight:500; color:var(--text-secondary);">' + letters[i] + '</span>';
    html += '<span style="flex:1; min-width:0;">' + stop.options[i] + '</span>';
    html += '</button>';
  }
  html += '</div>';
  html += '<p id="feedback" style="font-size:19px; margin:12px 0 0; min-height:20px; line-height:1.55;"></p>';
  html += '<p id="error-msg" style="font-size:19px; color:var(--text-danger); margin:6px 0 0; display:none;">選択肢を選んでください</p>';
  html += '<div style="margin-top:1rem;">';
  html += '<button id="next-btn" onclick="goNext()" style="font-size:18px; padding:13px 12px; opacity:0.5; pointer-events:none; width:100%;">' + (current === stops.length - 1 ? '結果を見る' : '次のフロアへ') + ' <i class="ti ti-arrow-right" style="font-size:19px; vertical-align:-2px;" aria-hidden="true"></i></button>';
  html += '</div>';
  html += '</div>';
  document.getElementById("content").innerHTML = html;
  renderStrip();
  renderScore();
}

function goToQuiz() {
  phase = "quiz";
  renderQuiz();
}

function selectAnswer(i) {
  if (answered) return;
  answered = true;
  var stop = stops[current];
  document.getElementById("error-msg").style.display = "none";
  for (var j = 0; j < stop.options.length; j++) {
    var btn = document.getElementById("opt-" + j);
    var badge = document.getElementById("opt-badge-" + j);
    btn.style.pointerEvents = "none";
    if (j === stop.correct) {
      btn.style.borderColor = "var(--border-success)";
      btn.style.background = "var(--bg-success)";
      btn.style.color = "var(--text-success)";
      badge.style.borderColor = "var(--border-success)";
      badge.style.color = "var(--text-success)";
    } else if (j === i) {
      btn.style.borderColor = "var(--border-danger)";
      btn.style.background = "var(--bg-danger)";
      btn.style.color = "var(--text-danger)";
      badge.style.borderColor = "var(--border-danger)";
      badge.style.color = "var(--text-danger)";
    }
  }
  var fb = document.getElementById("feedback");
  if (i === stop.correct) {
    score++;
    renderScore();
    fb.style.color = "var(--text-success)";
    fb.innerHTML = '<i class="ti ti-check" style="font-size:17px; vertical-align:-2px;" aria-hidden="true"></i> 正解! ' + stop.explain;
  } else {
    fb.style.color = "var(--text-danger)";
    fb.innerHTML = '<i class="ti ti-x" style="font-size:17px; vertical-align:-2px;" aria-hidden="true"></i> 残念! ' + stop.explain;
  }
  var nextBtn = document.getElementById("next-btn");
  nextBtn.style.opacity = "1";
  nextBtn.style.pointerEvents = "auto";
}

function goNext() {
  if (!answered) {
    document.getElementById("error-msg").style.display = "block";
    return;
  }
  if (current < stops.length - 1) {
    current++;
    phase = "fact";
    renderFact();
  } else {
    renderResult();
  }
}

function renderResult() {
  var pct = Math.round((score / stops.length) * 100);
  var title, msg, icon;
  if (score === stops.length) {
    title = "台北101マスター";
    msg = "満点です。もう台北101のガイドができますね。";
    icon = "ti-trophy";
  } else if (score >= stops.length / 2) {
    title = "台北101エキスパート";
    msg = "台北101についてよく理解できました。";
    icon = "ti-star";
  } else {
    title = "台北101ビギナー";
    msg = "また遊んで、もっと詳しくなりましょう。";
    icon = "ti-building-skyscraper";
  }
  var html = '';
  html += '<div style="background:var(--surface-1); border-radius:12px; padding:1.5rem 0.7rem; text-align:center;">';
  html += '<i class="ti ' + icon + '" style="font-size:30px; color:var(--text-accent);" aria-hidden="true"></i>';
  html += '<p style="font-size:22px; font-weight:500; margin:10px 0 6px;">' + title + '</p>';
  html += '<p style="font-size:18px; color:var(--text-secondary); margin:0 0 1.1rem;">' + msg + '</p>';
  html += '<p style="font-size:32px; font-weight:500; margin:0;">' + score + ' / ' + stops.length + '</p>';
  html += '<p style="font-size:16px; color:var(--text-muted); margin:4px 0 1.2rem;">正答率 ' + pct + '%</p>';
  html += '<button onclick="restart()" style="font-size:17px; padding:13px 16px; width:100%;"><i class="ti ti-refresh" style="font-size:18px; vertical-align:-2px; margin-right:4px;" aria-hidden="true"></i>もう一度ツアーする</button>';
  html += '</div>';
  document.getElementById("content").innerHTML = html;
}

function restart() {
  current = 0;
  phase = "fact";
  score = 0;
  renderFact();
}

renderFact();
</script>
